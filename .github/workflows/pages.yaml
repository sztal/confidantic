---
name: Publish documentation

on:
  workflow_call:
    inputs:
      ref:
        description: Validated commit whose documentation and coverage will be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    # Master builds and package releases share the same Pages destination.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download coverage data from this run's validation
        uses: actions/download-artifact@v5
        with:
          name: coverage-data
      - name: Build the documentation and coverage report
        run: |
          uv sync --locked --group docs --group test --extra all
          uv run --no-sync coverage json --data-file=coverage-data -o coverage.json
          uv run --no-sync zensical build --clean --strict
          uv run --no-sync coverage html --data-file=coverage-data -d site/coverage
          uv run --no-sync scripts/generate_coverage_badge.py coverage.json site/coverage.svg
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
