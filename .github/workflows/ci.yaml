---
name: CI

on:
  push:
    branches: [master]
  pull_request: null
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      ref: ${{ github.sha }}

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download coverage data
        uses: actions/download-artifact@v5
        with:
          name: coverage-data
      - name: Build the documentation and coverage report
        run: |
          uv sync --group docs --group test --extra all
          uv run coverage json --data-file=coverage-data -o coverage.json
          uv run zensical build --clean --strict
          uv run coverage html --data-file=coverage-data -d site/coverage
          uv run scripts/generate_coverage_badge.py coverage.json site/coverage.svg
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
