---
name: CI

on:
  push:
    branches: [master]
  pull_request: null
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      ref: ${{ github.sha }}

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: checks
    uses: ./.github/workflows/pages.yaml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
