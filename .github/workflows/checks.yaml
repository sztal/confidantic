---
name: Shared validation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v7
      - run: uv run noxfile.py -s lint
      - run: git diff --exit-code

  checks:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v7
      - run: make check-typecheck
      - run: uv run noxfile.py -s docs
      - run: git diff --exit-code

  distributions:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v7
      - run: make build
      - run: make check-dist
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - '3.15'
          - '3.14'
          - '3.13'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up the test suite
        run: >-
          uv run noxfile.py
          --install-only
          --error-on-missing-interpreters
          --session tests-${{ matrix.python_version }}
      - name: Run the test suite
        run: >-
          uv run noxfile.py
          --no-install
          --session tests-${{ matrix.python_version }}
        env:
          COVERAGE_FILE: coverage-data
      - name: Store coverage data
        if: matrix.python_version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage-data
